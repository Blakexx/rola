# CPU CI: the commit gate's checks on a fresh runner, through the graph exactly as a developer's machine runs them
# (docs/build-graph.md#checks): the pinned bazelisk, then the checks. It needs no GPU and no Docker -- the device
# tiers need a device, and the devbox image's check (`//:dev_container`) is the image's own, run where Docker runs.
#
# The GPU arm (the tiered suite against a real device, and the build that produces the binary it runs on) is declared
# here as a CONCURRENCY GROUP and nothing else. This repository has no GPU runner attached, and a job that silently
# skipped its only device would be worse than a group that honestly has nothing pointed at it yet. A device is a
# single resource: two builds racing for it is how a ratification gate ends up describing somebody else's binary.
name: lint

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: rola-cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/graph
      - name: the commit gate's checks
        run: bazel test $(bazel query 'tests(//:gate) except //:dev_container')
