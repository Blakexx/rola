[project]
name            = "rola"
dynamic         = ["version", "optional-dependencies"]  # setup.py: the `cu13` extra pins rola's own version
description     = "Routed Linear Attention — fused CUDA kernels with a ratified supported matrix"
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.10"
authors         = [{ name = "Blake Bottum" }]
dependencies    = ["torch>=2.13", "einops"]
keywords        = ["cuda", "attention", "linear-attention", "pytorch", "kernels"]
classifiers     = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Environment :: GPU :: NVIDIA CUDA :: 13",
]

[build-system]
# torch is DELIBERATELY EXCLUDED from `requires`: pip's build isolation would
# fetch a CPU-only torch from PyPI and build against the wrong ABI. Source
# installs are
#     pip install rola --no-build-isolation
# exactly as flash-attn and mamba-ssm require.
requires      = ["setuptools>=61", "wheel", "packaging", "psutil", "ninja"]
build-backend = "setuptools.build_meta"

[tool.ruff]
# Carried from the fork's `pyproject.toml` so that "ruff clean" means the same
# thing on both sides of the extraction; `known-first-party` is the one edit
# (`fla` -> `rola`).
target-version = "py310"
line-length     = 127

[tool.ruff.lint]
select        = ["E", "F", "UP", "B", "SIM", "I", "C4", "TCH", "T"]
extend-select = ["RUF022"]
ignore = [
  "E501", "E741",
  "B023", "B006", "B007", "B008", "B028", "B904", "B905",
  "C408", "C416", "C417",
  "T201",
  # TC001/2/3 -- REASON: this package does not maintain a `TYPE_CHECKING` import
  # split. Two import lists that must be kept in agreement, one of which is never
  # executed, is a maintenance cost paid for an import-time saving nobody measured;
  # and a runtime import that a refactor later needs (an isinstance, a default) is
  # then a NameError found by a user rather than by the interpreter. TC002/TC003
  # were already ignored on that reasoning -- TC001 was an inconsistency, not a
  # decision.
  "TC001", "TC002", "TC003",
  "SIM102", "SIM108", "SIM118", "SIM211",
  "COM812",
]

[tool.ruff.lint.isort]
#: `bench` and `probe` are this repository's benchmark packages under `benchmarks/`,
#: reached by the sys.path insert their drivers and `tests/conftest.py` perform. They
#: are first-party by ownership; without saying so, isort files them as third-party
#: and every module that imports both `rola` and `bench` is unsortable.
known-first-party        = ["rola", "bench", "probe"]
force-sort-within-sections = false

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*/*.py" = ["UP030"]
#: The benchmark harness is a package next to a script, so its drivers insert their
#: own directory on `sys.path` before importing it. The import is deliberately after
#: that line and cannot be moved above it.
"benchmarks/*.py" = ["E402"]
# RUF022 -- REASON: `rola/__init__.py`'s `__all__` is GROUPED BY CONCEPT with a
# comment per group (the op, the layer, the state, the configuration objects). That
# grouping is how a reader learns the shape of the public API; alphabetical order
# would interleave the four groups and delete the only documentation the list has.
"rola/__init__.py" = ["RUF022"]

# LINT2 (G_FOUNDATION G5 "readability lints", REPORT-ONLY until G5): E30x
# (pycodestyle's blank-line-spacing family, E301-E306) is NOT added to
# `[tool.ruff.lint].select` above -- ruff 0.16.5 gates E301-E306 behind
# `--preview` (measured: `ruff check --select E3 .` with no `--preview` warns
# "Selection E3 has no effect" and finds nothing, even though the full "E"
# family is already selected above), so touching the main `select`/`ignore`
# here would either do nothing (no `--preview`) or turn the GATING
# `ruff-check` hook red on 40 pre-existing violations (with `--preview`,
# measured on this tree 2026-08-29) -- exactly what "report-only" forbids.
# This table is read ONLY by `tools/lint/run_ruff_e3.sh`'s report-only
# pre-commit stage (`ruff check --select E3 --preview --exit-zero`, driven by
# the codes below, never by ruff itself -- `[tool.rola_lint]` is not a ruff
# config key, so ruff silently ignores this table): the E30x SELECTION lives
# here, declared, without moving what the gating hook enforces today. G5's
# flip is: fix the 40 violations, move these codes into the real `select`
# above, and delete this table.
[tool.rola_lint.report_only]
ruff_preview_select = ["E3"]

[tool.pytest.ini_options]
markers = [
  "cuda: launches a CUDA kernel (deselect with -m 'not cuda')",
  "ratify: compile-time ratification gate; no GPU required",
  # A LATENCY gate, not a correctness gate: it belongs to the nightly `bench` job
  # and is deselected everywhere else, so a noisy machine can never fail a merge.
  "bench: per-(cell, arm) latency against the committed baseline",
  # K39: a hypothesis-drawn (widths, k_tok, seed, cohort, d_v) sweep over the
  # oracle's `Cell` space, with shrinking. A SUPPLEMENT to the fixed named
  # cells (`rola-oracle-tests`: "never invent a new one ad hoc"), not a
  # replacement -- opt-in for the same reason `bench` is: an unbounded search
  # has no place in the default battery's runtime budget.
  "hypothesis_cells: hypothesis-drawn oracle cell sweep (opt-in, deselected by default)",
]
#: `bench` and `hypothesis_cells` are both opt-in; select either with `-m bench`
#: / `-m hypothesis_cells`.
addopts = "-m 'not bench and not hypothesis_cells'"
#: K39: a per-test wall so a hung kernel (a divergent `__syncwarp`, an
#: unreleased `flock`) becomes a NAMED failure instead of a stuck CI runner or
#: a live GPU held forever behind `/tmp/rola_gpu.lock` for every other agent
#: (KERNEL_STANDARDS §14, "a hang here blocks the whole flock queue"). 120s is
#: a conservative floor above every gated test's observed wall (the slowest
#: class on record, `test_oracle_gradcheck.py`'s double-precision backward
#: sweeps, runs in low tens of seconds) -- re-derive downward once per-test
#: timings are collected, never loosen it to chase a single slow test without
#: re-deriving. `timeout_method = "thread"`: the signal-based default cannot
#: interrupt a blocked CUDA call (the driver call is outside the interpreter's
#: signal-check points), so a real device hang would ignore SIGALRM and never
#: fire the timeout at all.
timeout = 120
timeout_method = "thread"
