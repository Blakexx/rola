# The dev container as a compose service. `.devcontainer/devcontainer.json` runs it; its initializeCommand
# (`bazel run //:container_compose`) first hands the devbox image to Docker and writes `compose.local.yaml` beside this
# file: the image's tag (its digest), the devbox's volumes, and the host's lock and driver mounts -- never committed.
services:
  rola:
    ipc: host
    working_dir: /workspace
    command: sleep infinity
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
#: the devbox's own volumes, once a machine: its home (the pinned tools, Bazel's caches, the environment store) and its
#: workspace (the checkouts)
volumes:
  rola-devbox-home:
    name: rola-devbox-home
  rola-devbox-work:
    name: rola-devbox-work
